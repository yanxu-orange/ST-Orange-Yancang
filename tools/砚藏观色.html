 let text=message(false,1,'<p>雨快停了。河边新开了一家书店，要不要去看看？</p>')+message(true,2,'<p>好呀，想找一本不用急着读完的书。</p>')+message(false,3,'<p>那就沿着河边慢慢走。雨已经小了，屋檐还在滴水，路边的树叶洗得很干净。</p><p>书店就在桥的另一头，门口摆着两盆长得有些随意的薄荷。推门时，风铃轻轻响了一声，柜台后的人抬起头，又笑着低下去整理书页。</p><p>我们可以挑一个临窗的位置。你找你的故事，我翻我的旧书，偶尔把读到的有趣句子递给对方看。不用规定几点离开，也不必把每一刻都安排得很有意义。</p><p>如果读累了，就看看窗外。河面浮着细碎的光，一只撑开的伞从桥上缓缓经过，远处有人收起晾在门前的衣服。</p><p>等天色再暗一点，我们再去找家小店吃饭。今天还有很多时间，足够慢慢挑一本书，也足够让一场雨下完。</p><hr class="preview-format-divider"><div class="preview-format-samples"><p><strong>把午后留给书页。</strong></p><p><em>风吹动了窗帘。</em></p><p><u>慢慢读，也慢慢走。</u></p><blockquote>不急着抵达，也是一种出发。</blockquote><p><code>书页与雨声</code></p></div>');

let background='#dcecf4',selectionSequence=0,wallpaperSequence=0;

frame.addEventListener('load',()=>{document.querySelector('#resource-status').textContent=current.label==='中性示例'?'文件仅用于本次预览':'外观资源按主题加载'});
function clearErrors(){document.querySelector('#file-message').textContent='';document.querySelector('#wallpaper-message').textContent='';document.querySelector('#avatar-message').textContent=''}
function render(){clearErrors();document.querySelector('#resource-status').textContent='正在显示预览……';frame.srcdoc=makeScene(current,background)}
fileInput.addEventListener('change',async()=>{const file=fileInput.files?.[0];if(!file){clearErrors();return}const sequence=++selectionSequence;try{const value=JSON.parse((await file.text()).replace(/^\uFEFF/,''));const settings=validateTheme(value);if(sequence!==selectionSequence)return;originalTheme=value;current={label:file.name,settings};document.querySelector('#theme-name').textContent=file.name;document.querySelector('#theme-name').title=file.name;document.querySelector('#file-message').textContent='';render()}catch{if(sequence===selectionSequence)document.querySelector('#file-message').textContent='这不是可用的主题 JSON，请重新选择。'}finally{fileInput.value=''}});
function setBackground(value,name,button=null){background=value;document.querySelectorAll('[data-bg],[data-wallpaper]').forEach(x=>x.setAttribute('aria-pressed',String(x===button)));document.querySelector('#wallpaper-name').textContent=name;document.querySelector('#wallpaper-name').title=name;document.querySelector('#wallpaper-message').textContent='';render()}
document.querySelectorAll('[data-bg],[data-wallpaper]').forEach(b=>{if(b.dataset.bg)b.querySelector('.swatch-image').style.backgroundColor=b.dataset.bg;else b.querySelector('.swatch-image').style.backgroundImage=wallpapers[Number(b.dataset.wallpaper)];b.title=b.textContent.trim()});
document.querySelectorAll('[data-bg]').forEach(b=>b.addEventListener('click',()=>{++wallpaperSequence;setBackground(b.dataset.bg,b.textContent,b)}));
document.querySelectorAll('[data-wallpaper]').forEach(b=>b.addEventListener('click',()=>{++wallpaperSequence;setBackground(wallpapers[Number(b.dataset.wallpaper)],b.textContent,b)}));
async function decodeLocalImage(file){const bytes=new Uint8Array(await file.arrayBuffer());let type='';if(bytes.length>8&&[137,80,78,71,13,10,26,10].every((b,i)=>bytes[i]===b))type='image/png';else if(bytes.length>3&&bytes[0]===255&&bytes[1]===216&&bytes[2]===255)type='image/jpeg';else if(bytes.length>12&&String.fromCharCode(...bytes.slice(0,4))==='RIFF'&&String.fromCharCode(...bytes.slice(8,12))==='WEBP')type='image/webp';if(!type)throw Error('type');const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(new Blob([bytes],{type}))});const image=new Image();image.src=data;await image.decode();if(!image.naturalWidth||!image.naturalHeight)throw Error('decode');return data;}
const wallpaperInput=document.querySelector('#wallpaper-file');
wallpaperInput.addEventListener('change',async()=>{const file=wallpaperInput.files?.[0];if(!file){clearErrors();return}const sequence=++wallpaperSequence;try{const data=await decodeLocalImage(file);if(sequence!==wallpaperSequence)return;setBackground('url("'+data+'")',file.name)}catch{if(sequence===wallpaperSequence)document.querySelector('#wallpaper-message').textContent='这张图片无法使用，请选择PNG、JPG或WebP。'}finally{wallpaperInput.value=''}});
document.querySelectorAll('[data-avatar-set]').forEach(button=>button.addEventListener('click',()=>{currentAvatarSet=button.dataset.avatarSet;document.querySelectorAll('[data-avatar-set]').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));render()}));
for(const kind of ['bot','user']){const input=document.querySelector('#avatar-'+kind+'-file');input.addEventListener('change',async()=>{const file=input.files?.[0];if(!file){clearErrors();return}const sequence=++avatarSequence[kind];try{const data=await decodeLocalImage(file);if(sequence!==avatarSequence[kind])return;sessionAvatars[kind]=data;const name=document.querySelector('#avatar-'+kind+'-name');name.textContent=file.name;name.title=file.name;render()}catch{if(sequence===avatarSequence[kind])document.querySelector('#avatar-message').textContent='这张头像无法使用，请选择PNG、JPG或WebP。'}finally{input.value=''}})}
document.querySelectorAll('label.file-picker').forEach(label=>label.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();document.getElementById(label.htmlFor).click()}}));
const previewStage=document.querySelector('#preview-stage'),fullscreenToggle=document.querySelector('#fullscreen-toggle');let fullscreenSession=null;
function syncExpanded(active){previewStage.classList.toggle('is-fullscreen',active);document.body.classList.toggle('preview-expanded',active);fullscreenToggle.textContent=active?'退出全屏':'全屏预览';fullscreenToggle.setAttribute('aria-pressed',String(active))}
function finishPreviewFullscreen(){if(!fullscreenSession)return;const previous=fullscreenSession;fullscreenSession=null;syncExpanded(false);document.querySelector('#preview-settings').open=previous.settingsOpen;window.scrollTo(previous.x,previous.y);fullscreenToggle.focus({preventScroll:true})}
async function leavePreviewFullscreen(){if(document.fullscreenElement===previewStage){try{await document.exitFullscreen()}catch{finishPreviewFullscreen()}}else finishPreviewFullscreen()}
fullscreenToggle.addEventListener('click',async()=>{if(fullscreenSession){await leavePreviewFullscreen();return}fullscreenSession={x:scrollX,y:scrollY,settingsOpen:document.querySelector('#preview-settings').open,native:false};syncExpanded(true);if(typeof previewStage.requestFullscreen==='function'){try{await previewStage.requestFullscreen();if(fullscreenSession)fullscreenSession.native=true}catch{/* Keep the same iframe in page-filled fallback. */}}});
document.addEventListener('fullscreenchange',()=>{if(document.fullscreenElement===previewStage){if(fullscreenSession)fullscreenSession.native=true;syncExpanded(true)}else if(fullscreenSession?.native)finishPreviewFullscreen()});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&fullscreenSession&&!document.fullscreenElement){event.preventDefault();finishPreviewFullscreen()}});

render();
</script></body></html>
